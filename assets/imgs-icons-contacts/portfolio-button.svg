<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 44" width="280" height="44">
  <defs>
    <clipPath id="roundedClip">
      <path d="M22,0 h236 a22,22 0 0,1 22,22 v0 a22,22 0 0,1 -22,22 h-236 a22,22 0 0,1 -22,-22 v0 a22,22 0 0,1 22,-22 z"/>
    </clipPath>
  </defs>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(102, 126, 234, 0.3)); }
      50% { filter: drop-shadow(0 0 8px rgba(102, 126, 234, 0.6)); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .badge {
      fill: #667eea;
      animation: pulse 2s ease-in-out infinite;
    }
    .shimmer {
      fill: rgba(255,255,255,0.15);
      animation: shimmer 60s ease-in-out infinite;
    }
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: white;
    }
    .icon {
      animation: glow 2s ease-in-out infinite;
    }
  </style>
  <g>
    <!-- Button background -->
    <path class="badge" d="M22,0 h236 a22,22 0 0,1 22,22 v0 a22,22 0 0,1 -22,22 h-236 a22,22 0 0,1 -22,-22 v0 a22,22 0 0,1 22,-22 z"/>
    
    <!-- Shimmer - clipped to rounded shape -->
    <g clip-path="url(#roundedClip)">
      <rect class="shimmer" x="-50" y="0" width="400" height="44"/>
    </g>
    
    <!-- Text -->
    <text class="text" x="55" y="28">✨ Check out my Portfolio →</text>
  </g>
</svg>
