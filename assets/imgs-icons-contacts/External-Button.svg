<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" width="260" height="40">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(102, 126, 234, 0.3)); }
      50% { filter: drop-shadow(0 0 8px rgba(102, 126, 234, 0.6)); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(220%); }
    }
    @keyframes float {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(3px); }
    }
    .badge {
      fill: url(#gradient);
      animation: pulse 2s ease-in-out infinite;
    }
    .shimmer {
      fill: rgba(255,255,255,0.12);
      animation: shimmer 120s ease-in-out infinite;
    }
    .icon {
      animation: glow 2s ease-in-out infinite;
    }
    .arrow {
      animation: float 2s ease-in-out infinite;
    }
  </style>
  <g>
    <path class="badge" d="M20,0 h220 a20,20 0 0,1 20,20 v0 a20,20 0 0,1 -20,20 h-220 a20,20 0 0,1 -20,-20 v0 a20,20 0 0,1 20,-20 z"/>
    <path class="shimmer" d="M20,0 h220 a20,20 0 0,1 20,20 v0 a20,20 0 0,1 -20,20 h-220 a20,20 0 0,1 -20,-20 v0 a20,20 0 0,1 20,-20 z"/>
    <text x="30" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white">✨ Check out my Portfolio</text>
    <g transform="translate(204, 10)" class="icon">
      <path fill="white" d="M14,5.5v7c0,1.657-1.343,3-3,3H4c-1.657,0-3-1.343-3-3v-7c0-1.657,1.343-3,3-3h7c.276,0,.5,.224,.5,.5s-.224,.5-.5,.5H4c-1.105,0-2,.895-2,2v7c0,1.105,.895,2,2,2h7c1.105,0,2-.895,2-2V5.5c0-.276,.224-.5,.5-.5s.5,.224,.5,.5Zm.5-3.5h-4c-.276,0-.5,.224-.5,.5s.224,.5,.5,.5h4c.132,0,.258,.031,.369,.084L6.854,9.146c-.195,.195-.195,.512,0,.707,.098,.098,.226,.146,.354,.146s.256-.049,.354-.146L13.353,3.354c.053,.112,.084,.237,.084,.369v4c0,.276,.224,.5,.5,.5s.5-.224,.5-.5V3.5c0-.787-.463-1.5-1.146-1.854-.164-.082-.346-.146-.538-.146Z"/>
    </g>
    <text class="arrow" x="225" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="white">→</text>
  </g>
</svg>
